<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Werkstatt-Quest</title>
<meta name="description" content="Lernspiel für KFZ-Technik, Elektrotechnik und Fachrechnen">
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werkstatt-Quest">
<style>
:root{--bg:#14181f;--panel:#1e2430;--panel2:#272f3d;--text:#eef2f7;--muted:#9aa6b8;--accent:#ffb020;--ok:#2ec27e;--bad:#e5484d;--kfz:#e8673a;--et:#f2c230;--fr:#4a9bf0;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:.65rem 1rem;background:var(--panel2);color:var(--text);transition:transform .08s,background .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#1b1300;font-weight:700}
button.ghost{background:transparent;border:1px solid #3a4456}
button.danger{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:#11151c;border:1px solid #3a4456;border-radius:10px;padding:.6rem .7rem;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin:.7rem 0 .25rem}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 60px}
header{position:sticky;top:0;z-index:5;background:rgba(20,24,31,.95);backdrop-filter:blur(6px);border-bottom:1px solid #2a3240}
header .wrap{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.3px;margin-right:auto;font-size:1.1rem}
.logo span{color:var(--accent)}
.tok{background:#2b2410;color:var(--accent);font-weight:800;border-radius:999px;padding:.35rem .8rem;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%}
nav button{padding:.45rem .75rem;font-size:.9rem}
nav button.on{background:var(--accent);color:#1b1300;font-weight:700}
h1{font-size:1.6rem;margin:.6rem 0}
h2{font-size:1.25rem;margin:1.2rem 0 .6rem}
.muted{color:var(--muted)}
.card{background:var(--panel);border-radius:var(--radius);padding:16px;margin:10px 0}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.world{border-top:5px solid var(--c)}
.world h2{margin-top:0;display:flex;gap:8px;align-items:center}
.lv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0;background:var(--panel2)}
.lv .st{margin-left:auto;font-size:.85rem}
.lv.locked{opacity:.5}
.lv.done{box-shadow:inset 4px 0 0 var(--ok)}
.qtext{font-size:1.2rem;font-weight:600;margin:.4rem 0 1rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:.85rem 1rem;background:var(--panel2);border:2px solid transparent}
.opt.right{border-color:var(--ok);background:#173a2a}
.opt.wrong{border-color:var(--bad);background:#3f1d20}
.bar{height:8px;background:#2a3240;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}
.fb.ok{background:#173a2a;border:1px solid var(--ok)}
.fb.no{background:#3f1d20;border:1px solid var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{text-align:left;min-height:52px;border:2px solid transparent}
.match button.sel{border-color:var(--accent)}
.badge{display:inline-block;min-width:1.5em;text-align:center;border-radius:99px;padding:0 .4em;font-weight:800;color:#111;margin-right:6px}
.game{text-align:center}
.price{font-weight:800;color:var(--accent)}
table{width:100%;border-collapse:collapse}
td,th{padding:.55rem .4rem;border-bottom:1px solid #2a3240;text-align:left}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button.on{background:var(--accent);color:#1b1300;font-weight:700}
.qitem{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #2a3240}
.qitem .t{flex:1}
.pill{font-size:.75rem;background:#2a3240;border-radius:99px;padding:.1rem .5rem;margin-right:4px;color:var(--muted)}
.react{height:260px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;user-select:none;cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto}
.mem button{aspect-ratio:1;font-size:2rem;padding:0}
.mem button.open{background:#33405a}
.mem button.found{background:#173a2a}
canvas{background:#2b2f36;border-radius:12px;max-width:100%;touch-action:none}
.big{font-size:2rem;font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:#1b1300;font-weight:700;padding:.7rem 1.1rem;border-radius:12px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.small{font-size:.85rem}
/* ---------- Neue Spiele ---------- */
.blink{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:12px auto}
.blink button{aspect-ratio:1;font-size:2.2rem;padding:0;background:#151a22;border:3px solid var(--c);opacity:.6;transition:none}
.blink button.lit{background:var(--c);opacity:1;box-shadow:0 0 26px var(--c);transform:scale(1.05)}
.wheel{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#aab3c1 0 14%,#7d8797 15% 47%,#3a4252 48% 60%,#0d0f13 61%)}
.wheel .hub{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#2a3240;border:3px solid #cfd6e0}
.nut{position:absolute;transform:translate(-50%,-50%);width:17%;aspect-ratio:1;border-radius:50%;padding:0;background:#e3e8ef;border:4px solid #4b5566;color:#fff;font-weight:900;font-size:1.1rem}
.nut:active{transform:translate(-50%,-50%) scale(.92)}
.nut.on{background:var(--ok);border-color:#fff}
.resistor{display:flex;align-items:center;justify-content:center;margin:18px auto 8px;max-width:340px}
.resistor i{flex:1;height:5px;background:#aab3c1}
.rbody{display:flex;gap:9%;align-items:stretch;justify-content:center;width:62%;height:64px;background:#d9c08c;border-radius:22px;padding:0 9%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.rbody span{flex:1;max-width:18px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.rbody .gold{background:#c9a227;margin-left:6%}
.net{display:grid;gap:3px;max-width:380px;margin:12px auto}
.net button{padding:0;aspect-ratio:1;background:#11151c;border-radius:6px}
.net svg{display:block;width:100%;height:100%}
/* ---------- Antwort-Animationen ---------- */
@keyframes fxPop{0%{transform:scale(1)}30%{transform:scale(1.07)}55%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes fxRing{0%{box-shadow:0 0 0 0 rgba(46,194,126,.75)}100%{box-shadow:0 0 0 18px rgba(46,194,126,0)}}
@keyframes fxShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-7px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(2px)}}
@keyframes fxIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fxFlash{0%{box-shadow:inset 0 0 0 3px var(--bad),0 0 26px rgba(229,72,77,.55)}100%{box-shadow:inset 0 0 0 0 rgba(229,72,77,0),0 0 0 rgba(229,72,77,0)}}
@keyframes fxGlow{0%{box-shadow:inset 0 0 0 3px var(--ok),0 0 26px rgba(46,194,126,.5)}100%{box-shadow:inset 0 0 0 0 rgba(46,194,126,0),0 0 0 rgba(46,194,126,0)}}
@keyframes fxBump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fxStamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-14deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15) rotate(-8deg)}}
.fx-pop{animation:fxPop .5s ease-out,fxRing .7s ease-out}
.fx-shake{animation:fxShake .5s ease-in-out}
.fx-reveal{animation:fxPop .5s ease-out .5s,fxRing .7s ease-out .5s}
.fx-in{animation:fxIn .35s ease-out .15s both}
.fx-flash{animation:fxFlash .7s ease-out}
.fx-glow{animation:fxGlow .8s ease-out}
.fx-bump{animation:fxBump .35s ease-out}
.tok{display:inline-block}
input.numok{border-color:var(--ok);background:#173a2a}
input.numbad{border-color:var(--bad);background:#3f1d20}
.fx-p{position:fixed;z-index:30;pointer-events:none;line-height:1;margin:-.5em 0 0 -.5em;will-change:transform,opacity}
.fx-stamp{position:fixed;z-index:30;pointer-events:none;font-size:5rem;line-height:1;font-weight:900;animation:fxStamp .9s ease-out both}
@media (prefers-reduced-motion:reduce){.fx-pop,.fx-shake,.fx-reveal,.fx-in,.fx-flash,.fx-glow,.fx-bump{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY='werkstattQuest_v1';
const WORLDS=[
 {id:'kfz',name:'KFZ-Technik',icon:'🚗',color:'var(--kfz)'},
 {id:'et',name:'Elektrotechnik',icon:'⚡',color:'var(--et)'},
 {id:'fr',name:'Fachrechnen',icon:'🧮',color:'var(--fr)'},
 {id:'edv',name:'EDV',icon:'💻',color:'#35c2b1'},
 {id:'it',name:'Italienisch',icon:'🇮🇹',color:'#4caf6a'},
 {id:'en',name:'Englisch',icon:'🇬🇧',color:'#b58cf5'}];
const KFZ_LF=[['LF 1','Wartung und Service',1],['LF 2','Verschleißreparaturen',1],['LF 3','Große Inspektion',2],['LF 4','Funktionsstörungen beheben',2],['LF 5','Energieversorgung, Hochvolt, Diesel',3],['LF 6','Startsysteme, Vernetzung, Komfort',3],['LF 7P','Sporadische Fehler, Datenanalyse',4],['LF 8P','Hauptuntersuchung, Prüfung',4]];
const LV={};
const GS_WORLDS=['et','edv','it','en'];
const LEVELS=['Grundstufe','1. KFZ','2. KFZ','3. KFZ','4. KFZ'];
const cls=p=>Math.min(LEVELS.length-1,Math.max(0,(p&&p.cls)|0));
const lvls=w=>LV[w]||(LV[w]=w==='kfz'?KFZ_LF.map(x=>({n:x[0],t:x[1],c:x[2]})):LEVELS.map((L,l)=>({n:'Level '+(l+1),t:L,c:l})));
const ahead=l=>lvls(ui.quiz.w)[l].c>cls(P());
const TYPES={mc:'Multiple Choice',tf:'Richtig/Falsch',num:'Rechenaufgabe',match:'Zuordnen'};
const POINTS=5, POINTS_AHEAD=8, PASS_BONUS=20, XP=10, XP_AHEAD=15, PASS_XP=50;
const half=(v,h)=>h?Math.ceil(v/2):v;
const ptsFor=(l,h)=>half(ahead(l)?POINTS_AHEAD:POINTS,h);
const xpFor=(l,h)=>half(ahead(l)?XP_AHEAD:XP,h);
const RANKS=[[0,'Werkstatt-Neuling'],[100,'Lehrling'],[250,'Fortgeschrittener Lehrling'],[500,'Geselle'],[900,'Erfahrener Geselle'],[1400,'Vorarbeiter'],[2000,'Werkstattmeister'],[3000,'Technik-Profi'],[4500,'Werkstatt-Legende']];
const rankOf=xp=>{let r=0;RANKS.forEach((x,i)=>{if((xp|0)>=x[0])r=i});return r};
function rankInfo(xp){xp=xp|0;const r=rankOf(xp),cur=RANKS[r][0],nxt=RANKS[r+1];return {r,name:RANKS[r][1],xp,next:nxt?nxt[0]:null,pct:nxt?Math.round((xp-cur)/(nxt[0]-cur)*100):100}}
function addXP(n){const p=P(),before=rankOf(p.xp);p.xp=(p.xp|0)+n;const after=rankOf(p.xp);if(after>before)setTimeout(()=>toast('⭐ Aufgestiegen! Du bist jetzt '+RANKS[after][1]),300)}
const visibleWorlds=()=>cls(P())===0?WORLDS.filter(w=>GS_WORLDS.includes(w.id)):WORLDS;
const GAMES=[
 {id:'react',name:'Ampelstart',icon:'🚦',price:30,desc:'Reaktionstest: Klick, sobald die Ampel grün wird.'},
 {id:'memory',name:'Werkstatt-Memory',icon:'🔧',price:60,desc:'Finde alle Paare mit möglichst wenigen Zügen.'},
 {id:'ohm',name:'Ohm-Blitz',icon:'⚡',price:100,desc:'30 Sekunden: So viele U = R · I-Aufgaben wie möglich.'},
 {id:'race',name:'Spur halten',icon:'🏁',price:150,desc:'Weiche den Pylonen aus, es wird immer schneller.'},
 {id:'blink',name:'Blinkcode',icon:'⚠️',price:200,unit:'Runden',desc:'Merke dir die immer längere Folge der Kontrollleuchten.'},
 {id:'wheel',name:'Boxenstopp',icon:'🛞',price:250,unit:'s',desc:'Radwechsel auf Zeit: 4 Räder, alle Schrauben über Kreuz anziehen.'},
 {id:'color',name:'Farbcode-Profi',icon:'🌈',price:300,unit:'Punkte',desc:'60 Sekunden: Widerstandswerte am Farbcode ablesen.'},
 {id:'net',name:'Stromkreis-Puzzle',icon:'🔌',price:400,unit:'Stromkreise',desc:'Drehe die Leitungen, bis alle Lampen leuchten. Die Pläne werden größer.'},
 {id:'catch',name:'Teile-Fänger',icon:'🧰',price:500,unit:'Punkte',desc:'Fange herabfallende Teile mit der Werkzeugkiste, weiche Öl und Feuer aus.'},
 {id:'drag',name:'Schaltprofi',icon:'🏎️',price:750,unit:'s',desc:'400-Meter-Rennen mit Drehzahlmesser: Starte bei Grün und schalte im richtigen Moment.'}];

/* ---------- Standard-Fragen ---------- */
let _id=0;
const mc=(w,l,text,opts,ex)=>({id:'d'+(++_id),world:w,level:l,type:'mc',text,options:opts,answer:0,explain:ex||''});
const tf=(w,l,text,ans,ex)=>({id:'d'+(++_id),world:w,level:l,type:'tf',text,answer:ans,explain:ex||''});
const num=(w,l,text,ans,unit,tol,ex)=>({id:'d'+(++_id),world:w,level:l,type:'num',text,answer:ans,unit:unit||'',tol:tol||0,explain:ex||''});
const mt=(w,l,text,pairs,ex)=>({id:'d'+(++_id),world:w,level:l,type:'match',text,pairs,explain:ex||''});
const DEFAULT_Q=[
// KFZ Grundstufe
mc('kfz',0,'Welche Aufgabe hat der Kühler?',['Er gibt die Wärme des Kühlmittels an die Luft ab','Er kühlt den Kraftstoff vor der Einspritzung','Er kühlt die Ansaugluft der Klimaanlage','Er speichert Kühlmittel für den Winter'],'Das heiße Kühlmittel aus dem Motor gibt im Kühler Wärme an den Fahrtwind bzw. Lüfterluft ab.'),
tf('kfz',0,'Ein Viertaktmotor braucht für einen vollständigen Arbeitszyklus zwei Kurbelwellenumdrehungen.',true,'4 Takte = 720° Kurbelwinkel = 2 Umdrehungen.'),
mc('kfz',0,'Wie lautet die richtige Reihenfolge der vier Takte?',['Ansaugen – Verdichten – Arbeiten – Ausstoßen','Verdichten – Ansaugen – Arbeiten – Ausstoßen','Ansaugen – Arbeiten – Verdichten – Ausstoßen','Arbeiten – Ansaugen – Ausstoßen – Verdichten']),
tf('kfz',0,'Die gesetzliche Mindestprofiltiefe für Pkw-Reifen beträgt in der EU 1,6 mm.',true,'1,6 mm ist das gesetzliche Minimum; empfohlen werden deutlich mehr.'),
mt('kfz',0,'Ordne jedes Bauteil seinem System zu.',[['Bremssattel','Bremsanlage'],['Zündkerze','Zündanlage'],['Stoßdämpfer','Fahrwerk'],['Lichtmaschine','Bordnetz']]),
// KFZ 1
mc('kfz',1,'Wofür steht die Abkürzung OT?',['Oberer Totpunkt','Ölthermostat','Optimale Temperatur','Obere Taktlage']),
mc('kfz',1,'Wie berechnet man den Hubraum eines Zylinders?',['Kolbenfläche × Hub','Bohrung × Hub','Kolbenfläche × Drehzahl','Hub × Zylinderanzahl']),
tf('kfz',1,'Beim Dieselmotor wird der Kraftstoff durch eine Zündkerze entzündet.',false,'Der Diesel ist ein Selbstzünder: Die stark verdichtete, heiße Luft entzündet den Kraftstoff.'),
mc('kfz',1,'Welche Betriebsflüssigkeit ist hygroskopisch (zieht Wasser an)?',['Bremsflüssigkeit','Motoröl','Getriebeöl','Scheibenwischwasser'],'Deshalb muss Bremsflüssigkeit regelmäßig gewechselt werden: Wasser senkt den Siedepunkt.'),
mt('kfz',1,'Ordne die Abkürzungen zu.',[['ABS','Antiblockiersystem'],['ESP','Elektronisches Stabilitätsprogramm'],['OBD','On-Board-Diagnose'],['AGR','Abgasrückführung']]),
// KFZ 2
mc('kfz',2,'Welche Aufgabe hat das Ausgleichsgetriebe (Differential)?',['Es ermöglicht unterschiedliche Raddrehzahlen bei Kurvenfahrt','Es erhöht die Motordrehzahl','Es trennt Motor und Getriebe beim Schalten','Es verteilt die Bremskraft']),
tf('kfz',2,'Ein Lambdawert von λ = 1 bedeutet ein stöchiometrisches Kraftstoff-Luft-Gemisch.',true),
mc('kfz',2,'Welcher Sensor liefert dem Motorsteuergerät die Motordrehzahl?',['Kurbelwellensensor','Klopfsensor','Lambdasonde','Luftmassenmesser']),
mc('kfz',2,'Wozu dient ein Abgasturbolader?',['Er nutzt Abgasenergie, um mehr Luft in die Zylinder zu drücken','Er kühlt die Abgase vor dem Katalysator','Er reduziert den Abgaslärm','Er treibt die Lichtmaschine an']),
tf('kfz',2,'Ein Katalysator arbeitet schon bei kaltem Motor mit voller Wirkung.',false,'Der Katalysator braucht eine Mindesttemperatur (Anspringtemperatur, ca. 250–300 °C).'),
// KFZ 3
mc('kfz',3,'Wie heißen die beiden Leitungen eines CAN-Busses?',['CAN-High und CAN-Low','CAN-Plus und CAN-Minus','CAN-Data und CAN-Clock','CAN-In und CAN-Out']),
mc('kfz',3,'Welchen Widerstand misst man (stromlos) zwischen CAN-High und CAN-Low beim High-Speed-CAN mit zwei Abschlusswiderständen?',['ca. 60 Ω','ca. 120 Ω','ca. 240 Ω','ca. 10 kΩ'],'Zwei 120-Ω-Abschlusswiderstände parallel ergeben 60 Ω.'),
tf('kfz',3,'Ein Dieselpartikelfilter wird regeneriert, indem der gesammelte Ruß abgebrannt wird.',true),
mc('kfz',3,'Was misst die Lambdasonde?',['Den Restsauerstoffgehalt im Abgas','Die Abgastemperatur','Den Abgasdruck','Den Kohlenmonoxidgehalt der Ansaugluft']),
mt('kfz',3,'Ordne die Anfangsbuchstaben der OBD-Fehlercodes zu.',[['P','Antrieb (Powertrain)'],['B','Karosserie (Body)'],['C','Fahrwerk (Chassis)'],['U','Netzwerk/Kommunikation']]),
// KFZ 4
mc('kfz',4,'Ab welcher Gleichspannung spricht man im Kfz von Hochvolt?',['über 60 V','über 12 V','über 24 V','über 1000 V']),
tf('kfz',4,'Vor Arbeiten am Hochvolt-System muss die Spannungsfreiheit festgestellt werden.',true,'Das ist eine der 5 Sicherheitsregeln.'),
mc('kfz',4,'Was bedeutet Rekuperation?',['Rückgewinnung von Bremsenergie','Schnelles Laden an der Ladesäule','Kühlung der Hochvoltbatterie','Abschaltung des Motors im Stand']),
mc('kfz',4,'Woraus besteht AdBlue?',['32,5 % Harnstofflösung in Wasser','Destilliertes Wasser mit Frostschutz','Ammoniakgas','Biodiesel-Zusatz']),
mt('kfz',4,'Ordne die ersten vier der 5 Sicherheitsregeln in der richtigen Reihenfolge zu.',[['1. Regel','Freischalten'],['2. Regel','Gegen Wiedereinschalten sichern'],['3. Regel','Spannungsfreiheit feststellen'],['4. Regel','Erden und kurzschließen']],'5. Regel: Benachbarte, unter Spannung stehende Teile abdecken oder abschranken.'),
// ET Grundstufe
mc('et',0,'In welcher Einheit wird der elektrische Widerstand angegeben?',['Ohm','Volt','Ampere','Watt']),
tf('et',0,'In einer Reihenschaltung fließt durch alle Widerstände derselbe Strom.',true),
num('et',0,'U = 12 V, R = 6 Ω. Wie groß ist der Strom I?',2,'A',0,'I = U / R = 12 V / 6 Ω = 2 A'),
mt('et',0,'Ordne jeder Größe ihre Einheit zu.',[['Spannung','Volt'],['Stromstärke','Ampere'],['Widerstand','Ohm'],['Leistung','Watt']]),
mc('et',0,'Wie wird ein Strommessgerät (Amperemeter) geschaltet?',['In Reihe zum Verbraucher','Parallel zum Verbraucher','Direkt zwischen Plus und Minus der Batterie','Egal, beides geht']),
// ET 1
num('et',1,'R1 = 4 Ω und R2 = 6 Ω sind in Reihe geschaltet. Wie groß ist der Gesamtwiderstand?',10,'Ω',0,'Reihe: R = R1 + R2'),
num('et',1,'Zwei Widerstände von je 10 Ω sind parallel geschaltet. Wie groß ist der Gesamtwiderstand?',5,'Ω',0,'Zwei gleiche Widerstände parallel: R/2'),
tf('et',1,'Ein Spannungsmessgerät wird parallel zum Verbraucher geschaltet.',true),
mc('et',1,'Mit welcher Formel berechnet man die elektrische Leistung?',['P = U · I','P = U / I','P = R · I','P = U + I']),

ät bei Sensorsignalen?","explain":"","type":"mc","options":["Das Signal passt logisch zu den anderen Messwerten und zum Betriebszustand","Das Signal ist besonders hoch","Das Signal ist immer konstant","Das Signal kommt vom teuersten Sensor"],"answer":0},{"id":"k7_022","world":"kfz","level":6,"text":"Bei kaltem Motor am Morgen zeigt der Kühlmitteltemperaturfühler 20 °C, der Ansauglufttemperaturfühler 85 °C. Was folgt daraus?","explain":"","type":"mc","options":["Einer der beiden Werte ist unplausibel und muss geprüft werden","Beide Werte sind in Ordnung","Der Motor ist überhitzt","Die Batterie ist leer"],"answer":0},{"id":"k7_023","world":"kfz","level":6,"text":"Was beschreibt die Langzeit-Gemischadaption (Long Term Fuel Trim)?","explain":"","type":"mc","options":["Die dauerhaft gelernte Korrektur der Einspritzmenge","Die Öltemperatur über lange Zeit","Den Kraftstoffverbrauch pro Jahr","Die Lebensdauer des Katalysators"],"answer":0},{"id":"k7_024","world":"kfz","level":6,"text":"Die Gemischadaption zeigt im Leerlauf einen stark positiven Wert, bei höherer Drehzahl ist sie fast normal. Was ist die wahrscheinlichste Ursache?","explain":"","type":"mc","options":["Falschluft im Ansaugtrakt","Zu hoher Kraftstoffdruck","Ein tropfendes Einspritzventil","Ein verstopfter Luftfilter"],"answer":0},{"id":"k7_025","world":"kfz","level":6,"text":"Was bedeutet eine stark negative Gemischadaption?","explain":"","type":"mc","options":["Das Steuergerät muss Kraftstoff wegnehmen, das Gemisch ist ohne Korrektur zu fett","Das Gemisch ist ohne Korrektur zu mager","Die Batterie ist tiefentladen","Der Motor hat zu wenig Öl"],"answer":0},{"id":"k7_026","world":"kfz","level":6,"text":"Wozu dient der Zündaussetzerzähler in den Messwerten?","explain":"","type":"mc","options":["Er zeigt, auf welchem Zylinder wie viele Aussetzer erkannt wurden","Er zählt die Motorstarts","Er zählt die Kilometer bis zum Service","Er misst die Zündspannung"],"answer":0},{"id":"k7_027","world":"kfz","level":6,"text" r","Damit es doppelt so schnell reagiert","Damit ein Sensor für den Tempomat frei bleibt","Damit das Pedal schwerer geht"],"answer":0},{"id":"k7_061","world":"kfz","level":6,"text":"Was passiert, wenn die beiden Fahrpedalsignale nicht zueinander passen?","explain":"","type":"mc","options":["Das Steuergerät legt einen Fehler ab und geht in den Notlauf","Der Motor gibt Vollgas","Nichts","Die Bremse wird gelöst"],"answer":0},{"id":"k7_062","world":"kfz","level":6,"text":"Was ist nach der Reinigung oder dem Tausch der elektrischen Drosselklappe oft nötig?","explain":"","type":"mc","options":["Eine Grundeinstellung bzw. Adaption mit dem Diagnosetester","Ein Ölwechsel","Eine Achsvermessung","Ein Tausch der Lambdasonde"],"answer":0},{"id":"k7_063","world":"kfz","level":6,"text":"Der Saugrohrdruck eines Saugmotors beträgt im Leerlauf fast Umgebungsdruck. Was kann die Ursache sein?","explain":"","type":"mc","options":["Große Falschluftmenge oder falsche Steuerzeiten","Ein neuer Luftfilter","Eine volle Batterie","Zu viel Kühlmittel"],"answer":0},{"id":"k7_064","world":"kfz","level":6,"text":"Wie prüft man ein Einspritzventil elektrisch?","explain":"","type":"mc","options":["Widerstand der Spule messen und Ansteuersignal mit dem Oszilloskop prüfen","Mit dem Reifendruckprüfer","Nur durch Ansehen","Mit dem Abgastester am Auspuff"],"answer":0},{"id":"k7_065","world":"kfz","level":6,"text":"Wie prüft man ein Ansaugsystem gezielt auf Falschluft?","explain":"","type":"mc","options":["Mit einem Rauchgerät (Nebelgerät), das austretenden Rauch an der undichten Stelle zeigt","Mit Wasser aus dem Schlauch bei laufendem Motor","Mit dem Multimeter","Mit dem Kompressionsdruckschreiber"],"answer":0},{"id":"k7_066","world":"kfz","level":6,"text":"Ein NTC-Temperaturfühler hat eine Unterbrechung. Welchen Wert zeigt das Steuergerät typischerweise?","explain":"","type":"mc","options":["Eine sehr niedrige Temperatur bzw. einen Ersatzwert","Eine sehr hohe Temperatur","Genau 20 °C","Den Öldruck"],"an lain":"","type":"mc","options":["Welche Steuergeräte an welchem Bussystem hängen und wie sie verbunden sind","Den Weg des Kühlmittels","Die Reihenfolge der Zündung","Die Lage der Wagenheberaufnahmen"],"answer":0},{"id":"k7_074","world":"kfz","level":6,"text":"Wozu dient das Codieren eines Steuergeräts?","explain":"","type":"mc","options":["Es passt das Steuergerät an die Ausstattung des Fahrzeugs an","Es löscht den Fehlerspeicher","Es lädt die Batterie","Es erhöht die Motorleistung"],"answer":0},{"id":"k7_075","world":"kfz","level":6,"text":"Was bedeutet „Anlernen“ (Adaption) eines Bauteils?","explain":"","type":"mc","options":["Das Steuergerät lernt die Kennwerte oder Endanschläge des neuen Bauteils","Der Lehrling lernt das Bauteil kennen","Das Bauteil wird mechanisch eingestellt","Der Fehlerspeicher wird gelöscht"],"answer":0},{"id":"k7_076","world":"kfz","level":6,"text":"Was ist bei einem Software-Update eines Steuergeräts besonders wichtig?","explain":"","type":"mc","options":["Eine stabile Spannungsversorgung, z. B. durch ein Stützladegerät","Den Motor mit hoher Drehzahl laufen lassen","Die Batterie abklemmen","Alle Türen öffnen"],"answer":0},{"id":"k7_077","world":"kfz","level":6,"text":"Was kann passieren, wenn ein Software-Update abbricht?","explain":"","type":"mc","options":["Das Steuergerät kann unbrauchbar werden","Die Software wird besser","Der Tank wird leer","Nichts"],"answer":0},{"id":"k7_078","world":"kfz","level":6,"text":"Was ist der Komponentenschutz?","explain":"","type":"mc","options":["Bestimmte Steuergeräte funktionieren erst vollständig, wenn sie online für das Fahrzeug freigeschaltet wurden","Ein Gehäuse aus Kunststoff","Eine Schutzfolie auf dem Display","Eine Sicherung im Sicherungskasten"],"answer":0},{"id":"k7_079","world":"kfz","level":6,"text":"Was ist beim Tausch eines Steuergeräts zu beachten?","explain":"","type":"mc","options":["Teilenummer und Softwarestand müssen passen, danach codieren und anlernen","Jedes Steuergerät passt ohne erabfrage gemacht?","explain":"","type":"mc","options":["Um zu bestätigen, dass der Fehler behoben ist und kein neuer Eintrag entstanden ist","Um Kraftstoff zu verbrauchen","Um die Reifen einzufahren","Um den Kunden warten zu lassen"],"answer":0},{"id":"k7_087","world":"kfz","level":6,"text":"Wie erklärst du dem Kunden einen sporadischen Fehler, der nicht sicher gefunden wurde?","explain":"","type":"mc","options":["Ehrlich sagen, was geprüft wurde, was die wahrscheinliche Ursache ist und wie es weitergeht","Behaupten, der Fehler sei sicher behoben","Nichts sagen","Dem Kunden die Schuld geben"],"answer":0},{"id":"k7_088","world":"kfz","level":6,"text":"Wie geht man mit Kundendaten und Fahrzeugdaten aus der Diagnose um?","explain":"","type":"mc","options":["Vertraulich: nur für den Auftrag verwenden und nicht an Unbefugte weitergeben","Im Internet veröffentlichen","An andere Kunden weitergeben","Offen am Tresen liegen lassen"],"answer":0},{"id":"k7_089","world":"kfz","level":6,"text":"Der Motor geht sporadisch aus und springt nach kurzer Zeit wieder an. Der Drehzahlmesser fällt dabei schlagartig auf null. Welcher Sensor ist besonders verdächtig?","explain":"","type":"mc","options":["Der Kurbelwellensensor","Die Lambdasonde","Der Klopfsensor","Der Außentemperaturfühler"],"answer":0},{"id":"k7_090","world":"kfz","level":6,"text":"Der Motor ruckelt nur beim Beschleunigen unter hoher Last. Was ist eine typische Ursache beim Ottomotor?","explain":"","type":"mc","options":["Zündungsfehler durch Zündkerzen oder Zündspulen","Zu hoher Reifendruck","Ein defekter Regensensor","Zu viel Scheibenwaschwasser"],"answer":0},{"id":"k7_091","world":"kfz","level":6,"text":"Ein Turbomotor fällt sporadisch in den Notlauf, gespeichert ist „Ladedruck Regelgrenze unterschritten“. Was prüfst du?","explain":"","type":"mc","options":["Dichtheit der Ladeluftstrecke und die Verstellung bzw. Ansteuerung des Laders","Die Glühlampen","Die Wischerblätter","Den Innenraumfilter"],"answer":0},{"id":"k7_092","world":"kfz","level":6,"text":"Der Motor startet warm schlecht, kalt gut. Welche Ursache ist möglich?","explain":"","type":"mc","options":["Ein Sensor, der warm ausfällt, oder ein falsches Temperatursignal","Eine zu neue Batterie","Zu viel Profil auf den Reifen","Ein voller Tank"],"answer":0},{"id":"k7_093","world":"kfz","level":6,"text":"Nach dem Tanken läuft der Motor kurz unrund und die MIL geht an. Welches System ist verdächtig?","explain":"","type":"mc","options":["Die Tankentlüftung (Aktivkohlefilter, Tankentlüftungsventil)","Die Bremsanlage","Die Lenkung","Die Klimaanlage"],"answer":0},{"id":"k7_094","world":"kfz","level":6,"text":"Ein Automatikgetriebe schaltet sporadisch hart, im Getriebesteuergerät steht ein Fehler zur Kommunikation mit dem Motorsteuergerät. Wo setzt du an?","explain":"","type":"mc","options":["Am Datenbus und an der Versorgung der beteiligten Steuergeräte","Am Getriebeölkühler","An den Bremsbelägen","An den Zündkerzen"],"answer":0},{"id":"k7_095","world":"kfz","level":6,"text":"Die Motorkontrollleuchte geht nach einigen Tagen von selbst wieder aus. Was bedeutet das?","explain":"","type":"mc","options":["Der Fehler ist in mehreren Fahrzyklen nicht mehr aufgetreten, der Eintrag bleibt aber zunächst gespeichert","Der Fehlerspeicher ist leer und nichts war je defekt","Die Leuchte ist durchgebrannt","Das Steuergerät wurde gelöscht"],"answer":0},{"id":"k7_096","world":"kfz","level":6,"text":"Ein Dieselmotor verliert sporadisch Leistung, der Differenzdruck am Partikelfilter ist sehr hoch. Was liegt nahe?","explain":"","type":"mc","options":["Der Partikelfilter ist stark beladen","Der Luftfilter ist neu","Der Tank ist voll","Die Kupplung rutscht"],"answer":0},{"id":"k7_097","world":"kfz","level":6,"text":"Leerlaufschwankungen nur bei eingeschalteten Verbrauchern wie Licht und Heckscheibenheizung. Was prüfst du zuerst?","explain":"","type":"mc","options":["Die Bordnetzspannung, den Generator und die Masseverbindungen","Die Reifen","Die Stoßdä ],"answer":0},{"id":"k8_011","world":"kfz","level":7,"text":"Was versteht man unter Abbremsung?","explain":"","type":"mc","options":["Das Verhältnis der gesamten Bremskraft zur Gewichtskraft des Fahrzeugs in Prozent","Die Zeit bis zum Stillstand","Den Weg des Bremspedals","Die Dicke der Bremsscheibe"],"answer":0},{"id":"k8_012","world":"kfz","level":7,"text":"Die Summe aller Bremskräfte beträgt 9000 N, die Gewichtskraft des Fahrzeugs 15 000 N. Wie groß ist die Abbremsung in Prozent?","explain":"z = 9000 N / 15 000 N = 0,60 = 60 %","hint":"Bremskraft geteilt durch Gewichtskraft mal 100","type":"num","answer":60.0,"unit":"%","tol":0.0},{"id":"k8_013","world":"kfz","level":7,"text":"An der Vorderachse bremst das linke Rad mit 2500 N, das rechte mit 2000 N. Wie groß ist die Differenz in Prozent, bezogen auf den größeren Wert?","explain":"(2500 − 2000) / 2500 = 0,20 = 20 %","hint":"Unterschied geteilt durch den größeren Wert mal 100","type":"num","answer":20.0,"unit":"%","tol":0.0},{"id":"k8_014","world":"kfz","level":7,"text":"Eine zu große Bremskraftdifferenz zwischen den Rädern einer Achse ist ein sicherheitsrelevanter Mangel.","explain":"","type":"tf","answer":true},{"id":"k8_015","world":"kfz","level":7,"text":"Die Bremskraft eines Rades schwankt auf dem Prüfstand bei gleichem Pedaldruck stark. Was ist die wahrscheinliche Ursache?","explain":"","type":"mc","options":["Unrunde Bremstrommel oder Bremsscheibe mit Dickenunterschied bzw. Schlag","Zu neue Bremsflüssigkeit","Zu hoher Reifendruck","Ein defekter Bremslichtschalter"],"answer":0},{"id":"k8_016","world":"kfz","level":7,"text":"Was wird an der Feststellbremse geprüft?","explain":"","type":"mc","options":["Wirkung auf dem Prüfstand, gleichmäßiger Zug und Leichtgängigkeit der Seile","Nur die Farbe des Hebels","Nur die Kontrollleuchte","Der Reifendruck hinten"],"answer":0},{"id":"k8_017","world":"kfz","level":7,"text":"Worauf prüft man Bremsschläuche und Bremsleitungen?","explain":"","type":"mc","options":["Auf Ris function startQuiz(w,l){const all=Q().filter(q=>q.world===w&&q.level===l),got=new Set((P().right||{})[w+'-'+l]||[]),n=Math.max(1,S.settings.perRound|0);
 const pool=shuffle(shuffle(all.filter(q=>!got.has(q.id))).concat(shuffle(all.filter(q=>got.has(q.id)))).slice(0,n));
 ui.quiz={w,l,qs:pool.map(prep),i:0,correct:0,earned:0,answered:false,ok:false,was:passed(w,l)};go('quiz')}
function prep(q){const o={q};
 if(q.type==='mc')o.order=shuffle(q.options.map((_,i)=>i));
 if(q.type==='match')o.m={right:shuffle(q.pairs.map((_,i)=>i)),sel:null,pairs:{}};
 return o}
const COLORS=['#ffb020','#4a9bf0','#2ec27e','#e8673a','#c27cf2','#f25c9b'];
function vQuiz(){const z=ui.quiz,it=z.qs[z.i],q=it.q,w=WORLDS.find(x=>x.id===z.w);
 let body='';
 if(q.type==='mc')body=`<div class="opts">${it.order.map(i=>{let c='';if(z.answered){if(i===q.answer)c='right';else if(i===it.pick)c='wrong'}
  const gone=it.removed&&it.removed.includes(i);
  return `<button class="opt ${c}" style="${gone?'opacity:.25;text-decoration:line-through':''}" ${z.answered||gone?'disabled':''} onclick="answer(${i})">${esc(q.options[i])}</button>`}).join('')}</div>`;
 if(q.type==='tf')body=`<div class="opts" style="grid-template-columns:1fr 1fr">${[true,false].map(b=>{let c='';if(z.answered){if(b===q.answer)c='right';else if(b===it.pick)c='wrong'}
  return `<button class="opt ${c}" style="text-align:center" ${z.answered?'disabled':''} onclick="answer(${b})">${b?'✔️ Richtig':'✖️ Falsch'}</button>`}).join('')}</div>`;
 if(q.type==='num')body=`<div class="row"><input id="numin" inputmode="decimal" style="max-width:200px" ${z.answered?'disabled':''} value="${z.answered?esc(it.pick):''}" onkeydown="if(event.key==='Enter')answerNum()"><b>${esc(q.unit)}</b>
  ${z.answered?'':'<button class="primary" onclick="answerNum()">Prüfen</button>'}</div>`;
 if(q.type==='match'){const m=it.m,colorOf=i=>COLORS[i%COLORS.length];
  const rightPaired=r=>Object.keys(m.pairs).find(k=>m.pairs[k]===r);
  body=`<p class="muted small">Tippe links einen Begriff an, dann rechts den passenden.</p><div class="match"><div class="grid">${q.pairs.map((p,i)=>{
   const has=m.pairs[i]!=null;let st='';if(z.answered)st=m.pairs[i]===i?'border-color:var(--ok)':'border-color:var(--bad)';

   <div class="grid">${m.right.map(r=>{const k=rightPaired(r);return `<button ${z.answered?'disabled':''} onclick="mPair(${r})">${k!=null?`<span class="badge" style="background:${colorOf(+k)}">${+k+1}</span>`:''}${esc(q.pairs[r][1])}</button>`}).join('')}</div></div>
   ${z.answered?'':`<div class="row" style="margin-top:12px"><button class="primary" ${Object.keys(m.pairs).length===q.pairs.length?'':'disabled'} onclick="answerMatch()">Prüfen</button></div>`}`}
 let hb='';
 if(it.hinted){const t=q.hint?esc(q.hint):q.type==='mc'?'Zwei falsche Antworten wurden entfernt.':'Ein richtiges Paar ist schon verbunden.';
  hb=`<div class="fb" style="background:#2b2410;border:1px solid var(--accent);margin:0 0 12px">💡 <b>Tipp:</b> ${t}</div>`}
 else if(!z.answered&&hintAvail(q))hb=`<div style="margin:-4px 0 12px"><button class="ghost small" onclick="useHint()">💡 Tipp anzeigen <span class="muted">(nur halbe Token und XP)</span></button></div>`;
 let fb='';

  if(q.type==='mc')sol=q.options[q.answer];else if(q.type==='tf')sol=q.answer?'Richtig':'Falsch';

const hintAvail=q=>!!q.hint||q.type==='mc'||q.type==='match';

function fxPart(txt,x,y,size,frames,opt){const e=document.createElement('span');e.className='fx-p';e.textContent=txt;e.style.cssText=`left:${x}px;top:${y}px;font-size:${size}px`;

function fxCoins(x,y,n){const t=document.querySelector('header .tok');if(!t)return;const r=t.getBoundingClientRect(),dx=r.left+r.width/2-x,dy=r.top+r.height/2-y;let last=null;
 for(let i=0;i<n;i++){const sx=(Math.random()*2-1)*60,sy=-30-Math.random()*50;
  last=fxPart('🪙',x,y,22,[{transform:'translate(0,0) scale(.5)',opacity:0},{transform:`translate(${sx}px,${sy}px) scale(1.2)`,opacity:1,offset:.3},{transform:`translate(${dx}px,${dy}px) scale(.6)`,opacity:1,offset:.95},{transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:0}],{duration:900,delay:120+i*90,easing:'ease-in-out'})}
 if(last){const done=last.onfinish;last.onfinish=()=>{done();const k=document.querySelector('header .tok');if(k){k.classList.remove('fx-bump');void k.offsetWidth;k.classList.add('fx-bump')}}}}

function fxStamp(el,txt,color){const r=el.getBoundingClientRect(),e=document.createElement('div');e.className='fx-stamp';e.textContent=txt;

function fx(ok){const z=ui.quiz,it=z.qs[z.i],q=it.q,$=s=>document.querySelector(s);

 else if(q.type==='num'){src=$('#numin');if(src)src.classList.add(ok?'numok':'numbad',ok?'fx-pop':'fx-shake')}
 else{src=$(ok?'.opt.right':'.opt.wrong');if(src)src.classList.add(ok?'fx-pop':'fx-shake');if(!ok){const r=$('.opt.right');if(r)r.classList.add('fx-reveal')}}
 if(fxCalm()||!src)return;
 const r=src.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 if(ok){fxBurst(x,y);fxCoins(x,y,Math.min(6,ptsFor(z.l,it.hinted)));if(card)fxStamp(card,'✔','var(--ok)')}
 else{fxDrop(x,y,Math.min(r.width,260));if(card)fxStamp(card,'✘','var(--bad)')}}

 const x=parseFloat(raw.replace(/\s/g,'').replace(',','.'));if(isNaN(x)){toast('Bitte eine Zahl eingeben');return}
 const tol=q.tol>0?q.tol:Math.max(Math.abs(q.answer)*0.005,1e-9);settle(Math.abs(x-q.answer)<=tol,raw)}
function mSel(i){const m=ui.quiz.qs[ui.quiz.i].m;m.sel=m.sel===i?null:i;render()}
function mPair(r){const m=ui.quiz.qs[ui.quiz.i].m;if(m.sel==null){toast('Zuerst links einen Begriff wählen');return}

 if(passed(z.w,z.l)&&!z.was){d.passed=true;z.newPass=true;z.bonus=PASS_BONUS;p.tokens+=PASS_BONUS;p.earned+=PASS_BONUS;z.xp=(z.xp||0)+PASS_XP;addXP(PASS_XP)}
 d.best=Math.max(d.best,pct);p.done[key]=d;save();go('result')}
function vResult(){const z=ui.quiz,L=lvls(z.w),ok=passed(z.w,z.l),hasNext=z.l+1<L.length,n=rightN(P(),z.w,z.l),nd=needFor(z.w,z.l);

/* ---------- Spielhalle ---------- */
function vArcade(){const p=P();
 return `<h1>🎮 Spielhalle</h1><p class="muted">Gib deine Token aus, um Minispiele dauerhaft freizuschalten.</p>
 <div class="grid g2">${GAMES.map(g=>{const own=p.games.includes(g.id),b=p.bests[g.id];
 return `<div class="card game"><div style="font-size:2.6rem">${g.icon}</div><h2 style="margin:.3rem 0">${g.name}</h2><p class="muted small">${g.desc}</p>

 ${own?`<button class="primary" onclick="play('${g.id}')">Spielen ▶</button>`:`<button ${p.tokens>=g.price?'':'disabled'} onclick="buy('${g.id}')">Freischalten für <span class="price">${g.price} 🪙</span></button>${p.tokens<g.price?`<p class="muted small" style="margin:.5rem 0 0">Dir fehlen noch ${g.price-p.tokens} 🪙</p>`:''}`}</div>`}).join('')}</div>`}
function bestTxt(id,b){const g=GAMES.find(x=>x.id===id);return id==='react'?b+' ms':id==='memory'?b+' Züge':fmt(b)+' '+((g&&g.unit)||'Punkte')}
function buy(id){const g=GAMES.find(x=>x.id===id),p=P();if(p.tokens<g.price)return;p.tokens-=g.price;p.games.push(id);save();toast(g.name+' freigeschaltet! 🎉');render()}
function play(id){ui.game=id;go('game')}
function setBest(id,val,lowerBetter){const p=P(),b=p.bests[id];if(b==null||(lowerBetter?val<b:val>b)){p.bests[id]=val;save();return true}return false}
function vGame(){const g=GAMES.find(x=>x.id===ui.game);return `<div class="row"><h1>${g.icon} ${g.name}</h1><button class="ghost" style="margin-left:auto" onclick="go('arcade')">◀ Zurück</button></div><div id="gm" class="card game"></div>`}
function startGame(){({react:gReact,memory:gMemory,ohm:gOhm,race:gRace,blink:gBlink,wheel:gWheel,color:gColor,net:gNet,catch:gCatch,drag:gDrag})[ui.game](document.getElementById('gm'))}

function gReact(el){let state='idle',t0=0,timer=null;
 const draw=(bg,txt)=>{el.innerHTML=`<div class="react" id="rb" style="background:${bg}">${txt}</div><p class="muted small">Bestwert: ${P().bests.react!=null?P().bests.react+' ms':'–'}</p>`;
  document.getElementById('rb').onpointerdown=hit};
 function startRound(){state='wait';draw('#7a1f22','🔴 Warten …');timer=setTimeout(()=>{state='go';t0=performance.now();draw('#1f7a45','🟢 JETZT!')},1500+Math.random()*2500)}
 function hit(){if(state==='idle'||state==='done'){startRound();return}
  if(state==='wait'){clearTimeout(timer);state='done';draw('#4a3a10','⚠️ Zu früh! Tippen für neuen Versuch');return}
  if(state==='go'){const ms=Math.round(performance.now()-t0);state='done';const nb=setBest('react',ms,true);draw('#1e2430',`${ms} ms ${nb?'🏆 Neuer Rekord!':''}<br><span class="small muted">Tippen für neuen Versuch</span>`)}}
 draw('#1e2430','Tippen zum Starten');stopGame=()=>clearTimeout(timer)}

function gMemory(el){const icons=['🔧','🔩','⚙️','🛞','🔋','💡','🚗','⛽'];let cards=shuffle(icons.concat(icons)).map(i=>({i,open:false,found:false})),first=null,lock=false,moves=0,timer=null;
 function draw(){const done=cards.every(c=>c.found);
  el.innerHTML=`<p>Züge: <b>${moves}</b></p><div class="mem">${cards.map((c,k)=>`<button class="${c.found?'found':c.open?'open':''}" data-k="${k}">${c.open||c.found?c.i:'❔'}</button>`).join('')}</div>
  ${done?`<p class="big">Geschafft in ${moves} Zügen!</p><button class="primary" id="again">Nochmal</button>`:''}`;
  el.querySelectorAll('.mem button').forEach(b=>b.onclick=()=>flip(+b.dataset.k));const a=document.getElementById('again');if(a)a.onclick=()=>{stopGame();gMemory(el)}}
 function flip(k){const c=cards[k];if(lock||c.open||c.found)return;c.open=true;
  if(first==null){first=k;draw();return}
  moves++;const f=cards[first];
  if(f.i===c.i){f.found=c.found=true;f.open=c.open=false;first=null;if(cards.every(x=>x.found)){if(setBest('memory',moves,true))toast('🏆 Neuer Rekord!')}draw()}
  else{lock=true;draw();timer=setTimeout(()=>{f.open=c.open=false;first=null;lock=false;draw()},800)}}
 draw();stopGame=()=>clearTimeout(timer)}

function gOhm(el){let score=0,left=30,cur=null,iv=null,running=false;
 function task(){const R=[1,2,3,4,5,6,8,10,12][Math.floor(Math.random()*9)],I=[1,2,3,4,5,6][Math.floor(Math.random()*6)],U=R*I,k=Math.floor(Math.random()*3);
  return k===0?{q:`R = ${R} Ω, I = ${I} A → U = ?`,a:U,u:'V'}:k===1?{q:`U = ${U} V, R = ${R} Ω → I = ?`,a:I,u:'A'}:{q:`U = ${U} V, I = ${I} A → R = ?`,a:R,u:'Ω'}}
 function drawStart(msg){el.innerHTML=`${msg||''}<p>30 Sekunden, so viele Aufgaben wie möglich. Bestwert: ${P().bests.ohm!=null?P().bests.ohm:'–'}</p><button class="primary" id="st">Start</button>`;document.getElementById('st').onclick=start}
 function drawTask(){el.innerHTML=`<div class="row" style="justify-content:space-between"><b>⏱️ <span id="tl">${left}</span> s</b><b>Punkte: ${score}</b></div><p class="big">${cur.q}</p>
  <div class="row" style="justify-content:center"><input id="oa" inputmode="decimal" style="max-width:140px;font-size:1.4rem;text-align:center"><b>${cur.u}</b><button class="primary" id="ok">OK</button></div>`;
  const inp=document.getElementById('oa');inp.focus();const sub=()=>{const v=parseFloat(inp.value.replace(',','.'));if(isNaN(v))return;if(Math.abs(v-cur.a)<1e-9){score++}else{toast('Falsch: '+cur.a+' '+cur.u)}cur=task();drawTask()};
  inp.onkeydown=e=>{if(e.key==='Enter')sub()};document.getElementById('ok').onclick=sub}
 function start(){score=0;left=30;running=true;cur=task();drawTask();
  iv=setInterval(()=>{left--;const t=document.getElementById('tl');if(t)t.textContent=left;if(left<=0){clearInterval(iv);running=false;const nb=setBest('ohm',score,false);drawStart(`<p class="big">${score} Punkte ${nb?'🏆':''}</p>`)}},1000)}
 drawStart();stopGame=()=>clearInterval(iv)}

function gRace(el){el.innerHTML=`<canvas id="cv" width="300" height="440"></canvas><div class="row" style="justify-content:center;margin-top:10px"><button id="bl" style="font-size:1.6rem;width:110px">◀</button><button class="primary" id="bs">Start</button><button id="br" style="font-size:1.6rem;width:110px">▶</button></div><p class="muted small">Start: Knopf, Tippen aufs Spielfeld oder Leertaste. Lenken: Knöpfe, Pfeiltasten oder links/rechts aufs Spielfeld tippen. Bestwert: ${P().bests.race!=null?P().bests.race:'–'}</p>`;
 const cv=document.getElementById('cv'),c=cv.getContext('2d');let lane=1,obs=[],speed=3,score=0,raf=null,alive=false,spawn=0,stripe=0,tp=0,crashT=-1e9;
 const LX=[50,150,250];
 function reset(){lane=1;obs=[];speed=3;score=0;spawn=0;alive=true;tp=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
 function start(){if(!alive&&performance.now()-crashT>400)reset()}
 function move(d){if(alive)lane=Math.max(0,Math.min(2,lane+d))}
 function banner(a,b){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,170,300,90);c.fillStyle='#fff';c.textAlign='center';c.font='bold 22px system-ui';c.fillText(a,150,210);c.font='15px system-ui';c.fillText(b,150,240)}
 document.getElementById('bl').onclick=()=>move(-1);document.getElementById('br').onclick=()=>move(1);document.getElementById('bs').onclick=start;
 cv.onpointerdown=e=>{if(!alive){start();return}const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)};
 const key=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(alive)move(e.key==='ArrowLeft'?-1:1);else if(!e.repeat)start()}
  else if((e.key===' '||e.key==='Enter')&&!alive&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)start()}};window.addEventListener('keydown',key);
 function drawScene(k){c.fillStyle='#2b2f36';c.fillRect(0,0,300,440);c.fillStyle='#dcdcdc';stripe=(stripe+k)%40;
  for(let x of[100,200])for(let y=-40+stripe;y<440;y+=40)c.fillRect(x-2,y,4,20);
  c.font='34px serif';c.textAlign='center';obs.forEach(o=>c.fillText('🚧',LX[o.l],o.y));c.fillText('🏎️',LX[lane],410);
  c.fillStyle='#fff';c.font='bold 16px system-ui';c.textAlign='left';c.fillText('Punkte: '+score,10,22)}
 function loop(t){if(!alive)return;const k=speed*Math.max(0,Math.min(3,(t-tp)/16.667));tp=t;spawn-=k;if(spawn<=0){obs.push({l:Math.floor(Math.random()*3),y:-10});spawn=140+Math.random()*80}
  obs.forEach(o=>o.y+=k);obs=obs.filter(o=>{if(o.y>460){score++;return false}return true});speed=Math.min(11,3+score*0.12);
  if(obs.some(o=>o.l===lane&&o.y>375&&o.y<435)){alive=false;crashT=performance.now();drawScene(0);const nb=setBest('race',score,false);banner('Crash! '+score+' Punkte'+(nb?' 🏆':''),'Tippen oder Start für neue Runde');return}
  drawScene(k);raf=requestAnimationFrame(loop)}
 drawScene(0);banner('Bereit?','Tippe hier oder drücke Start');stopGame=()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',key)}}

function gBlink(el){const L=['🔋','🛢️','🌡️','⚠️','💡','⛽'],C=['#e5484d','#ffb020','#4a9bf0','#f2c230','#2ec27e','#c27cf2'];let seq=[],pos=0,busy=true,on=false,score=0,T=[];
 const later=(f,ms)=>T.push(setTimeout(f,ms)),msg=t=>{const m=document.getElementById('bm');if(m)m.textContent=t};
 function draw(head){el.innerHTML=`${head||''}<p>Merke dir die Reihenfolge der Kontrollleuchten und tippe sie nach. Jede Runde kommt eine dazu. Bestwert: ${P().bests.blink!=null?P().bests.blink+' Runden':'–'}</p>
  <div class="blink">${L.map((x,i)=>`<button data-i="${i}" style="--c:${C[i]}">${x}</button>`).join('')}</div><p id="bm" class="muted">&nbsp;</p><button class="primary" id="bst">Start</button>`;
  el.querySelectorAll('.blink button').forEach(b=>b.onpointerdown=()=>press(+b.dataset.i));document.getElementById('bst').onclick=start}
 function lit(i,ms){const b=el.querySelector(`.blink button[data-i="${i}"]`);if(!b)return;b.classList.add('lit');later(()=>b.classList.remove('lit'),ms)}
 function round(){busy=true;pos=0;seq.push(Math.floor(Math.random()*6));msg('Runde '+seq.length+': Zuschauen …');const sp=Math.max(330,680-seq.length*25);
  seq.forEach((s,k)=>later(()=>lit(s,sp*.6),500+k*sp));later(()=>{busy=false;msg('Du bist dran!')},500+seq.length*sp)}
 function start(){if(on)return;T.forEach(clearTimeout);T=[];on=true;seq=[];score=0;document.getElementById('bst').hidden=true;round()}
 function press(i){if(!on||busy)return;lit(i,180);
  if(i===seq[pos]){pos++;if(pos===seq.length){score=seq.length;busy=true;msg('✔ Richtig!');later(round,800)}}
  else{on=false;T.forEach(clearTimeout);T=[];const nb=setBest('blink',score,false);draw(`<p class="big">${score} Runden geschafft ${nb?'🏆':''}</p>`)}}
 draw();stopGame=()=>T.forEach(clearTimeout)}

function gWheel(el){let wheel=0,done=[],last=null,t0=0,pen=0,iv=null;
 const time=()=>(performance.now()-t0)/1000+pen;
 function intro(head){el.innerHTML=`${head||''}<p>Boxenstopp: Ziehe an allen 4 Rädern die 5 Radschrauben <b>über Kreuz</b> an. Nie die Nachbarschraube der zuletzt angezogenen nehmen. Jeder Fehler kostet 2 Sekunden.</p><p class="muted small">Bestzeit: ${P().bests.wheel!=null?fmt(P().bests.wheel)+' s':'–'}</p><button class="primary" id="ws">Start</button>`;
  document.getElementById('ws').onclick=()=>{wheel=0;done=[];last=null;pen=0;t0=performance.now();clearInterval(iv);iv=setInterval(tick,100);draw()}}
 function tick(){const e=document.getElementById('wt');if(e)e.textContent=fmt(time().toFixed(1))}
 function draw(){el.innerHTML=`<div class="row" style="justify-content:space-between"><b>Rad ${wheel+1} / 4</b><b>⏱️ <span id="wt">0,0</span> s</b></div>
  <div class="wheel" id="wh">${[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return `<button class="nut ${done.includes(i)?'on':''}" data-i="${i}" aria-label="Radschraube ${i+1}" style="left:${50+27*Math.cos(a)}%;top:${50+27*Math.sin(a)}%">${done.includes(i)?'✓':''}</button>`}).join('')}<div class="hub"></div></div>
  <p class="muted small">Über Kreuz anziehen: immer eine Schraube überspringen.</p>`;
  el.querySelectorAll('.nut').forEach(b=>b.onpointerdown=()=>tap(+b.dataset.i));tick()}
 function tap(i){if(done.includes(i))return;
  if(last!=null&&[1,4].includes(Math.abs(i-last))){pen+=2;toast('Nachbarschraube! +2 s');const w=document.getElementById('wh');w.classList.remove('fx-shake');void w.offsetWidth;w.classList.add('fx-shake');return}
  done.push(i);last=i;
  if(done.length===5){wheel++;done=[];last=null;
   if(wheel===4){clearInterval(iv);const val=Math.round(time()*10)/10,nb=setBest('wheel',val,true);intro(`<p class="big">${fmt(val)} s ${nb?'🏆 Neue Bestzeit!':''}</p>`);return}}
  draw()}
 intro();stopGame=()=>clearInterval(iv)}

function gColor(el){const COL=[['Schwarz','#111111'],['Braun','#7b4a1e'],['Rot','#d42a2a'],['Orange','#f5821f'],['Gelb','#f2d21b'],['Grün','#2a9d3c'],['Blau','#2563d8'],['Violett','#8e3cc4'],['Grau','#8a8f98'],['Weiß','#f4f4f4']];
 let score=0,left=60,iv=null,cur=null,help=false;
 const fR=v=>v>=1e6?fmt(+(v/1e6).toFixed(2))+' MΩ':v>=1e3?fmt(+(v/1e3).toFixed(2))+' kΩ':fmt(+v.toFixed(1))+' Ω';
 function task(){const a=1+Math.floor(Math.random()*9),b=Math.floor(Math.random()*10),m=Math.floor(Math.random()*6),v=(a*10+b)*10**m,opts=[v];
  shuffle([v*10,v/10,v*100,(b*10+a)*10**m,(a*10+b+1)*10**m]).forEach(x=>{if(opts.length<4&&x>0&&!opts.some(o=>fR(o)===fR(x)))opts.push(x)});
  return {bands:[a,b,m],v,opts:shuffle(opts)}}
 function intro(head){el.innerHTML=`${head||''}<p>60 Sekunden: Lies den Farbcode und wähle den richtigen Widerstandswert. Ein Fehler kostet 5 Sekunden.</p><p class="muted small">Bestwert: ${P().bests.color!=null?P().bests.color+' Punkte':'–'}</p><button class="primary" id="cst">Start</button>`;
  document.getElementById('cst').onclick=()=>{score=0;left=60;cur=task();draw();clearInterval(iv);iv=setInterval(()=>{left--;tl();if(left<=0)end()},1000)}}

 intro();stopGame=()=>clearInterval(iv)}

function gNet(el){let n=4,g=[],src=0,solved=0,left=180,iv=null,run=false,lock=false,T=null;
 const D=[[1,0,-1],[2,1,0],[4,0,1],[8,-1,0]],opp=b=>b===1?4:b===2?8:b===4?1:2,rot=m=>((m<<1)&15)|(m>>3),bits=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1);
 function lit(){const L=new Set([src]),st=[src];while(st.length){const c=st.pop(),x=c%n,y=Math.floor(c/n);
   D.forEach(([b,dx,dy])=>{const X=x+dx,Y=y+dy,k=Y*n+X;if(g[c]&b&&X>=0&&Y>=0&&X<n&&Y<n&&g[k]&opp(b)&&!L.has(k)){L.add(k);st.push(k)}})}return L}
 function gen(){n=Math.min(6,4+Math.floor(solved/2));let seen;
  do{g=new Array(n*n).fill(0);src=Math.floor(n/2)*n+Math.floor(n/2);seen=new Set([src]);const front=[src];
   while(front.length){const c=front[Math.floor(Math.random()*front.length)],x=c%n,y=Math.floor(c/n);
    const opt=bits(g[c])>=3?[]:D.filter(([b,dx,dy])=>{const X=x+dx,Y=y+dy;return X>=0&&Y>=0&&X<n&&Y<n&&!seen.has(Y*n+X)});
    if(!opt.length){front.splice(front.indexOf(c),1);continue}
    const [b,dx,dy]=opt[Math.floor(Math.random()*opt.length)],k=(y+dy)*n+x+dx;g[c]|=b;g[k]|=opp(b);seen.add(k);front.push(k)}
  }while(seen.size<n*n);
  do{g=g.map(m=>{for(let r=Math.floor(Math.random()*4);r>0;r--)m=rot(m);return m})}while(lit().size===n*n)}
 function intro(head){el.innerHTML=`${head||''}<p>Drehe die Leitungsstücke so, dass der Strom von der Batterie zu allen Lampen fließt. Du hast 3 Minuten, die Schaltpläne werden größer.</p><p class="muted small">Bestwert: ${P().bests.net!=null?P().bests.net+' Stromkreise':'–'}</p><button class="primary" id="nst">Start</button>`;
  document.getElementById('nst').onclick=()=>{solved=0;left=180;run=true;lock=false;gen();draw();clearInterval(iv);iv=setInterval(()=>{left--;const t=document.getElementById('nt');if(t)t.textContent=left;
   if(left<=0){clearInterval(iv);clearTimeout(T);run=false;const nb=setBest('net',solved,false);intro(`<p class="big">${solved} Stromkreise ${nb?'🏆':''}</p>`)}},1000)}}
 function draw(){const L=lit();el.innerHTML=`<div class="row" style="justify-content:space-between"><b>⏱️ <span id="nt">${left}</span> s</b><b>Stromkreise: ${solved}</b></div>
  <div class="net" style="grid-template-columns:repeat(${n},1fr)">${g.map((m,k)=>{const on=L.has(k),col=on?'#ffb020':'#5b6577';
   return `<button data-k="${k}" aria-label="Leitung drehen"><svg viewBox="0 0 40 40"><g stroke="${col}" stroke-width="6" stroke-linecap="round" fill="none">${m&1?'<path d="M20 20V1"/>':''}${m&2?'<path d="M20 20H39"/>':''}${m&4?'<path d="M20 20V39"/>':''}${m&8?'<path d="M20 20H1"/>':''}</g>
   ${k===src?'<rect x="9" y="9" width="22" height="22" rx="5" fill="#2ec27e"/><text x="20" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#06200f">+</text>':bits(m)===1?`<circle cx="20" cy="20" r="9" fill="${on?'#ffe08a':'#232a36'}" stroke="${col}" stroke-width="3"/>`:`<circle cx="20" cy="20" r="3.5" fill="${col}"/>`}</svg></button>`}).join('')}</div>
  <p class="muted small">Tippe auf ein Feld, um es zu drehen. Grün = Batterie, Kreise = Lampen.</p>`;
  el.querySelectorAll('.net button').forEach(b=>b.onclick=()=>{if(lock||!run)return;const k=+b.dataset.k;g[k]=rot(g[k]);draw();
   if(lit().size===n*n){solved++;lock=true;toast('💡 Stromkreis geschlossen!');T=setTimeout(()=>{lock=false;if(!run)return;gen();draw()},900)}})}
 intro();stopGame=()=>{clearInterval(iv);clearTimeout(T);run=false}}

function gCatch(el){el.innerHTML=`<canvas id="cc" width="300" height="440"></canvas><div class="row" style="justify-content:center;margin-top:10px"><button id="cbl" style="font-size:1.6rem;width:110px">◀</button><button class="primary" id="cbs">Start</button><button id="cbr" style="font-size:1.6rem;width:110px">▶</button></div><p class="muted small">Fange Schrauben, Zahnräder und Werkzeug mit der Kiste. Öl und Feuer kosten ein Leben. Auf dem Spielfeld ziehen, Pfeiltasten oder Knöpfe halten. Bestwert: ${P().bests.catch!=null?P().bests.catch:'–'}</p>`;
 const cv=document.getElementById('cc'),c=cv.getContext('2d'),GOOD=['🔩','⚙️','🔧','🛞'],BAD=['🛢️','🔥'];let x=150,dir=0,items=[],score=0,lives=3,alive=false,raf=null,tp=0,spawn=0,flash=0;
 function scene(){c.fillStyle=flash>0?'#4a2327':'#232832';c.fillRect(0,0,300,440);c.fillStyle='#161a21';c.fillRect(0,424,300,16);c.textAlign='center';c.font='28px serif';items.forEach(o=>c.fillText(o.ch,o.x,o.y));
  c.font='40px serif';c.fillText('🧰',x,420);c.fillStyle='#fff';c.font='bold 16px system-ui';c.textAlign='left';c.fillText('Punkte: '+score,10,22);c.textAlign='right';c.fillText('❤️'.repeat(Math.max(0,lives)),292,22)}
 function loop(t){if(!alive)return;const dt=Math.min(.05,(t-tp)/1000);tp=t;flash-=dt;x=Math.max(24,Math.min(276,x+dir*280*dt));spawn-=dt;
  if(spawn<=0){const bad=Math.random()<Math.min(.45,.2+score*.004),set=bad?BAD:GOOD;items.push({ch:set[Math.floor(Math.random()*set.length)],bad,x:22+Math.random()*256,y:-10,v:(120+score*4)*(.8+Math.random()*.5)});spawn=Math.max(.33,.9-score*.01)}
  items.forEach(o=>o.y+=o.v*dt);
  items=items.filter(o=>{if(o.y>385&&o.y<428&&Math.abs(o.x-x)<32){if(o.bad){lives--;flash=.25}else score++;return false}return o.y<470});
  scene();
  if(lives<=0){alive=false;const nb=setBest('catch',score,false);c.fillStyle='rgba(0,0,0,.65)';c.fillRect(0,170,300,90);c.fillStyle='#fff';c.textAlign='center';c.font='bold 22px system-ui';c.fillText(score+' Teile gefangen'+(nb?' 🏆':''),150,210);c.font='15px system-ui';c.fillText('Start drücken für neue Runde',150,240);return}
  raf=requestAnimationFrame(loop)}
 const ptr=e=>{if(!alive)return;const r=cv.getBoundingClientRect();x=Math.max(24,Math.min(276,(e.clientX-r.left)/r.width*300))};cv.onpointerdown=ptr;cv.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')ptr(e)};
 const hold=(id,d)=>{const b=document.getElementById(id);b.onpointerdown=()=>dir=d;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{if(dir===d)dir=0}};hold('cbl',-1);hold('cbr',1);
 document.getElementById('cbs').onclick=()=>{if(alive)return;cancelAnimationFrame(raf);x=150;items=[];score=0;lives=3;spawn=.5;flash=0;alive=true;tp=performance.now();raf=requestAnimationFrame(loop)};
 const kd=e=>{if(e.key==='ArrowLeft'){dir=-1;e.preventDefault()}if(e.key==='ArrowRight'){dir=1;e.preventDefault()}},ku=e=>{if(e.key==='ArrowLeft'&&dir===-1)dir=0;if(e.key==='ArrowRight'&&dir===1)dir=0};
 window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);scene();
 stopGame=()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku)}}

function gDrag(el){el.innerHTML=`<canvas id="dc" width="320" height="300"></canvas><div class="row" style="justify-content:center;margin-top:10px"><button class="primary" id="da" style="font-size:1.25rem;min-width:230px;padding:1rem">Bereit machen</button></div><p class="muted small">400 m aus dem Stand. Bei Grün losfahren, dann immer im grünen Drehzahlbereich hochschalten. Knopf oder Leertaste. Bestzeit: ${P().bests.drag!=null?fmt(P().bests.drag)+' s':'–'}</p>`;
 const cv=document.getElementById('dc'),c=cv.getContext('2d'),btn=document.getElementById('da'),G=[3.4,2.1,1.5,1.15,.95,.8],K=147;
 let st='idle',v=0,s=0,gear=0,t=0,cut=0,raf=null,tp=0,T=[],note='',noteC='#fff',lamp=0,res=null;
 const rpm=()=>st==='run'?Math.max(1200,v*G[gear]*K):st==='go'||st==='lights'?1200:900,ang=r=>(150+Math.min(8000,r)/8000*240)*Math.PI/180;
 const say=(n,col)=>{note=n;noteC=col||'#fff'};
 function arc(a,b,col,w){c.beginPath();c.arc(160,170,100,ang(a),ang(b));c.strokeStyle=col;c.lineWidth=w;c.stroke()}
 function scene(){c.fillStyle='#1b2029';c.fillRect(0,0,320,300);
  for(let i=0;i<3;i++){c.beginPath();c.arc(130+i*30,24,10,0,7);c.fillStyle=st==='go'||st==='run'||st==='done'?'#2ec27e':lamp>i?'#e5484d':'#3a4252';c.fill()}
  c.lineCap='butt';arc(0,6300,'#5b6577',12);arc(6300,7000,'#2ec27e',12);arc(7000,8000,'#e5484d',12);
  c.fillStyle='#9aa6b8';c.font='12px system-ui';c.textAlign='center';for(let i=0;i<=8;i++){const a=ang(i*1000);c.fillText(i,160+78*Math.cos(a),174+78*Math.sin(a))}
  const a=ang(rpm());c.beginPath();c.moveTo(160,170);c.lineTo(160+92*Math.cos(a),170+92*Math.sin(a));c.strokeStyle='#ffb020';c.lineWidth=4;c.lineCap='round';c.stroke();c.beginPath();c.arc(160,170,8,0,7);c.fillStyle='#ffb020';c.fill();
  c.fillStyle='#fff';c.font='bold 40px system-ui';c.fillText(st==='run'||st==='done'?gear+1:'N',160,232);c.font='12px system-ui';c.fillStyle='#9aa6b8';c.fillText('Gang · x1000 1/min',160,250);
  c.textAlign='left';c.fillStyle='#fff';c.font='bold 16px system-ui';c.fillText(Math.round(v*3.6)+' km/h',10,60);c.textAlign='right';c.fillText(fmt(t.toFixed(2))+' s',310,60);
  c.textAlign='center';c.fillStyle=noteC;c.font='bold 17px system-ui';c.fillText(note,160,272);
  c.fillStyle='#3a4252';c.fillRect(10,284,300,8);c.fillStyle='#ffb020';c.fillRect(10,284,300*Math.min(1,s/400),8)}
 function loop(now){const dt=Math.min(.05,(now-tp)/1000);tp=now;
  if(st==='go'||st==='run')t+=dt;
  if(st==='run'){const r=v*G[gear]*K;let acc;if(r>=7200){acc=-1.5;say('Begrenzer! Schalten!','#e5484d')}else acc=cut>0?0:Math.max(.45,1-((r-5600)/4800)**2)*G[gear]*2.6;
   cut-=dt;acc-=.0006*v*v;v=Math.max(0,v+acc*dt);s+=v*dt;
   if(s>=400){st='done';res=Math.round(t*100)/100;t=res;const nb=setBest('drag',res,true);say('Ziel! '+fmt(res.toFixed(2))+' s'+(nb?' 🏆 Bestzeit!':''),'#2ec27e');btn.textContent='Nochmal';scene();return}}
  scene();raf=requestAnimationFrame(loop)}
 function act(){
  if(st==='idle'||st==='done'){T.forEach(clearTimeout);T=[];cancelAnimationFrame(raf);st='lights';v=0;s=0;gear=0;t=0;cut=0;lamp=0;say('');btn.textContent='Warten …';
   [1,2,3].forEach(i=>T.push(setTimeout(()=>lamp=i,i*600)));T.push(setTimeout(()=>{st='go';say('LOS!','#2ec27e');btn.textContent='START'},1800+700+Math.random()*1500));tp=performance.now();raf=requestAnimationFrame(loop);return}
  if(st==='lights'){T.forEach(clearTimeout);T=[];cancelAnimationFrame(raf);st='idle';lamp=0;say('Frühstart! Nochmal.','#e5484d');btn.textContent='Bereit machen';scene();return}
  if(st==='go'){st='run';say('');btn.textContent='SCHALTEN ⬆';return}
  if(st==='run'&&gear<5){const r=v*G[gear]*K,ok=r>=6300&&r<=7000;say(ok?'Perfekt geschaltet!':r<6300?'Zu früh geschaltet':'Zu spät geschaltet',ok?'#2ec27e':'#ffb020');cut=ok?.1:.32;gear++;if(gear===5)btn.textContent='Letzter Gang'}}
 btn.onpointerdown=e=>{e.preventDefault();act()};const kd=e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();if(!e.repeat)act()}};window.addEventListener('keydown',kd);scene();
 stopGame=()=>{T.forEach(clearTimeout);cancelAnimationFrame(raf);window.removeEventListener('keydown',kd)}}

 <label>Erklärung / Lösungsweg (optional, wird nach der Antwort gezeigt)</label><textarea id="eX" style="min-height:60px">${esc(e.explain)}</textarea>
 <div class="row" style="margin-top:12px"><button class="primary" onclick="saveQ()">Speichern</button><button class="ghost" onclick="ui.edit=null;render()">Abbrechen</button></div></div>`}
function saveQ(){const g=id=>document.getElementById(id).value,ty=g('eT'),text=g('eQ').trim();if(!text){toast('Fragetext fehlt');return}
 const q={id:ui.edit.id||('u'+Date.now().toString(36)),world:g('eW'),level:+g('eL'),type:ty,text,explain:g('eX').trim(),hint:g('eH').trim()};
 if(ty==='mc'){const lines=g('eMC').split('\n').map(s=>s.trim()).filter(Boolean),stars=lines.filter(s=>s.startsWith('*')).length;
  if(lines.length<2||stars!==1){toast('Mind. 2 Antworten und genau eine mit * markieren');return}
  q.answer=lines.findIndex(s=>s.startsWith('*'));q.options=lines.map(s=>s.replace(/^\*\s*/,''))}
 if(ty==='tf')q.answer=g('eTF')==='1';
 if(ty==='num'){const a=parseFloat(g('eNA').replace(',','.')),t=parseFloat((g('eNT')||'0').replace(',','.'));if(isNaN(a)){toast('Ergebnis muss eine Zahl sein');return}q.answer=a;q.unit=g('eNU').trim();q.tol=isNaN(t)?0:Math.abs(t)}
 if(ty==='match'){const pairs=g('eMT').split('\n').map(s=>s.split('=')).filter(p=>p.length>=2&&p[0].trim()&&p.slice(1).join('=').trim()).map(p=>[p[0].trim(),p.slice(1).join('=').trim()]);
  if(pairs.length<2||pairs.length>6){toast('2 bis 6 Paare im Format links = rechts');return}q.pairs=pairs}
 ensureOwn();const i=S.questions.findIndex(x=>x.id===q.id);if(i>=0)S.questions[i]=q;else S.questions.push(q);
 ui.fW=q.world;ui.fL=q.level;ui.edit=null;save();toast('Gespeichert ✔');render()}
function vSettings(){const s=S.settings;return `<div class="card">
 <label>Fragen pro Runde</label><input id="sR" type="number" min="1" max="30" value="${s.perRound}" style="max-width:120px">
 <label>Richtig gelöste Fragen zum Aufsteigen (hat ein Level weniger Fragen, gilt die Hälfte seiner Fragen)</label><input id="sP" type="number" min="1" max="100" value="${(s.need|0)||50}" style="max-width:120px">
 <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input id="sA" type="checkbox" style="width:auto" ${s.allOpen?'checked':''}> Alle Level für alle Schüler offen (sonst: frühere Klassen und das erste Level der eigenen Klasse offen, Aufstieg über richtig gelöste Fragen)</label>
 <label>Neues Lehrer-Passwort (leer lassen = unverändert)</label><input id="sPW" type="password" style="max-width:260px">
 <div class="row" style="margin-top:12px"><button class="primary" onclick="saveSettings()">Speichern</button></div></div>`}
function saveSettings(){const s=S.settings,g=id=>document.getElementById(id);s.perRound=Math.min(30,Math.max(1,parseInt(g('sR').value)||5));s.need=Math.min(100,Math.max(1,parseInt(g('sP').value)||50));s.allOpen=g('sA').checked;
 if(g('sPW').value.trim())s.pw=g('sPW').value.trim();save();toast('Einstellungen gespeichert ✔');render()}
function vPlayers(){const names=Object.keys(S.players);return `<div class="card">${names.length?`<table><tr><th>Name</th><th>Klasse</th><th>🪙</th><th>XP</th><th>Level</th><th></th></tr>${names.map(n=>{const p=S.players[n];
 return `<tr><td>${esc(n)}</td><td><select style="padding:.3rem;min-width:110px" onchange='setCls(${esc(JSON.stringify(n))},this.value)'>${LEVELS.map((L,l)=>`<option value="${l}" ${l===cls(p)?'selected':''}>${L}</option>`).join('')}</select></td><td>${p.tokens}</td><td>${p.xp|0}</td><td>${passedCount(p)}</td><td><button class="small ${ui.armed==='p:'+n?'danger':''}" onclick='delPlayer(${esc(JSON.stringify(n))})'>${ui.armed==='p:'+n?'Wirklich?':'🗑️'}</button></td></tr>`}).join('')}</table>`:'<p class="muted">Keine Spieler.</p>'}
 <div class="row" style="margin-top:12px"><button class="${ui.armed==='all'?'danger':''}" onclick="delAll()">${ui.armed==='all'?'Wirklich ALLE Spieler löschen?':'Alle Spieler löschen (neues Schuljahr)'}</button></div></div>`}
function setCls(n,v){S.players[n].cls=+v;save();toast('Klasse geändert ✔')}
function delPlayer(n){if(ui.armed!=='p:'+n){ui.armed='p:'+n;render();return}delete S.players[n];if(S.current===n)S.current=null;ui.armed=null;save();render()}
function delAll(){if(ui.armed!=='all'){ui.armed='all';render();return}S.players={};S.current=null;ui.armed=null;save();toast('Alle Spieler gelöscht');render()}
function vExport(){const json=JSON.stringify({app:'werkstatt-quest',version:2,questions:Q(),settings:{perRound:S.settings.perRound,need:S.settings.need,allOpen:S.settings.allOpen}},null,1);
 return `<div class="card"><h2 style="margin-top:0">Fragen sichern</h2><p class="muted small">Kopiere diesen Text und speichere ihn z. B. in einer Textdatei oder schick ihn mir zum Einbauen.</p>
 <textarea id="exp" readonly style="min-height:140px;font-family:monospace;font-size:.75rem">${esc(json)}</textarea>
 <div class="row" style="margin-top:8px"><button class="primary" onclick="copyExp()">📋 Kopieren</button></div></div>
 <div class="card"><h2 style="margin-top:0">Fragen laden</h2><p class="muted small">Gesicherten Text einfügen oder eine Datei wählen. Die aktuellen Fragen werden dabei ersetzt.</p>
 <input type="file" accept=".json,.txt" onchange="readFile(this)"><textarea id="imp" placeholder="Hier einfügen …" style="margin-top:8px;font-family:monospace;font-size:.75rem"></textarea>
 <div class="row" style="margin-top:8px"><button class="primary" onclick="doImport()">Laden</button><button class="${ui.armed==='reset'?'danger':''}" onclick="resetQ()">${ui.armed==='reset'?'Wirklich zurücksetzen?':'Auf Standard-Fragen zurücksetzen'}</button></div></div>`}
function copyExp(){const t=document.getElementById('exp');try{navigator.clipboard.writeText(t.value).then(()=>toast('Kopiert ✔'),()=>{t.select();toast('Text markiert, bitte mit Strg+C kopieren')})}catch(e){t.select();toast('Text markiert, bitte mit Strg+C kopieren')}}
function readFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('imp').value=r.result};r.readAsText(f)}
function doImport(){try{const d=JSON.parse(document.getElementById('imp').value);let qs=Array.isArray(d)?d:d.questions;
 if(!Array.isArray(qs))throw 0;
 if((d.version|0)<2){const mp={0:0,1:0,2:2,3:4,4:6};qs=qs.filter(q=>q&&!(q.world==='kfz'&&/^(d\d+|n_kfz)/.test(q.id||''))).map(q=>{if(q.world==='kfz')q.level=mp[q.level]||0;return q});
  const have=new Set(qs.map(q=>q.id));KFZ_Q.forEach(q=>{if(!have.has(q.id))qs.push(q)})}
 if(!qs.every(q=>q&&q.text&&TYPES[q.type]&&WORLDS.some(w=>w.id===q.world)&&q.level>=0&&q.level<lvls(q.world).length))throw 0;
 S.questions=qs;if(d.settings)Object.assign(S.settings,{perRound:d.settings.perRound||S.settings.perRound,need:d.settings.need!=null?d.settings.need:S.settings.need,allOpen:!!d.settings.allOpen});
 save();toast(qs.length+' Fragen geladen ✔');render()}catch(e){toast('Der Text ist kein gültiger Fragen-Export')}}
function resetQ(){if(ui.armed!=='reset'){ui.armed='reset';render();return}S.questions=null;S.deleted=[];ui.armed=null;save();toast('Standard-Fragen wiederhergestellt');render()}

render();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
